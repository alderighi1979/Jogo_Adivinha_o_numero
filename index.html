<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/main.css" type="text/css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <title>Jodo de adivinhação de Números</title>
</head>
<body>
    <div class="container">
        <h1>Advinhe o número!</h1>
        <p>Estou pensando em um número entre 1 e 100.</p>
        <input type="number" id="guessInput" placeholder="Digite sua aposta">
        <button id="guessButton">Adivinhar</button>
        <p id="message"></p>
        <p>Tentativas: <span id="attempts">0</span></p>
        <button id="restartButton" style="display: none;">Reiniciar Jogo</button>
    </div>
    <script src="/main.js"></script>
</body>
</html>
